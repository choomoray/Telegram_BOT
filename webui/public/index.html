<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Bot 数据库控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login-view" class="login-view">
  <div class="login-card">
    <h1>🔐 Telegram Bot 数据库控制台</h1>
    <p class="login-hint">请输入登录密码</p>
    <input type="password" id="login-password" placeholder="密码" autocomplete="current-password">
    <button id="login-btn">登 录</button>
    <p id="login-error" class="login-error hidden"></p>
  </div>
</div>

<div id="app-view" class="app-view hidden">
  <header class="topbar">
    <div class="topbar-title">🗄️ 数据库控制台</div>
    <div class="topbar-right">
      <button id="insert-btn" class="btn btn-sm" disabled title="插入数据（全部数据库模式下不可用）">➕ 插入数据</button>
      <select id="collection-select-top" class="coll-select" title="选择数据库（默认全部）"></select>
      <button id="refresh-btn" class="btn btn-sm">🔄 刷新</button>
      <label class="auto-refresh"><input type="checkbox" id="auto-refresh"> 定时刷新</label>
      <button id="logout-btn" class="btn-ghost btn-sm">退出</button>
    </div>
  </header>

  <div class="panels">
    <!-- 左栏：上 2/3 后端实时日志，下 1/3 数据库操作 -->
    <section class="panel panel-left">
      <div class="log-panel">
        <div class="log-title">📡 后端实时日志 <span id="log-status" class="text-dim"></span></div>
        <div id="log-list" class="log-list"></div>
      </div>
      <div class="op-panel" id="op-panel">
        <!-- AI 翻译面板：仅 AI 翻译时出现，压缩上方日志区 -->
        <div id="ai-panel" class="ai-panel hidden">
          <div class="ai-panel-header">
            <span class="ai-panel-title">🤖 AI 翻译</span>
            <span id="ai-explain" class="ai-explain"></span>
            <button id="ai-close-btn" class="btn btn-ghost btn-sm">✕ 关闭</button>
          </div>
          <textarea id="op-json" class="op-json" placeholder="AI 翻译的操作 JSON（可编辑），点【执行】按此执行" spellcheck="false"></textarea>
        </div>
        <div class="op-row">
          <select id="collection-select-op" class="coll-select" title="选择数据库（与顶部同步，默认全部）">
            <option value="__all__">全部数据库</option>
          </select>
          <button id="selected-btn" class="btn btn-sm selected-off" title="点击右侧数据可选中，用于操作定位" disabled>未选中</button>
          <input id="prompt-input" class="prompt-input" placeholder='自然语言操作，如：查标记次数超过5的组 / 把用户12345设为白名单'>
          <button id="ai-btn" class="btn btn-ai btn-sm">AI 翻译</button>
          <button id="exec-btn" class="btn btn-sm">执行</button>
        </div>
        <div id="result-line" class="result-line">📤 执行结果</div>
      </div>
    </section>

    <!-- 右栏：数据库数据浏览（可滚动、点击选中） -->
    <section class="panel panel-right">
      <div class="data-toolbar">
        <div class="data-toolbar-row">
          <span id="data-meta" class="data-meta">加载中...</span>
          <select id="sort-select" class="coll-select" title="排序方式">
            <option value="desc">最新在前</option>
            <option value="asc">最早在前</option>
          </select>
          <div id="pagination" class="pagination"></div>
        </div>
      </div>
      <div id="data-list" class="data-list"></div>
    </section>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
